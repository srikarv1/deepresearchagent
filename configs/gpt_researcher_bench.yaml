run_name: gpt-researcher-bench
output_dir: runs
seed: 17
concurrency: 1

dataset:
  name: deep_research_bench
  language: en
  limit: 50
  query_ids: []

agent:
  name: gpt_researcher
  config: configs/agents/gpt_researcher.yaml

llm:
  provider: mock
  model: unused
search:
  backend: mock
  top_k: 5

budget:
  max_steps: 32
  max_searches: 64
  max_reads: 128
  max_tokens: 400000
  max_latency_s: 1200.0
  max_evidence: 512
  enforce: false

eval:
  official_benches: []
  # official_benches: [deep_research_bench]
