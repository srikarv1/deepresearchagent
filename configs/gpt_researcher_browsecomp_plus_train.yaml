run_name: gpt-researcher-browsecomp-plus-train
output_dir: runs
seed: 17
concurrency: 1

dataset:
  # Trajectory generation for PILOT. Same agent + retriever as the table, but
  # only the train ids (581). Val (83) is for later checkpoint choices.
  name: browsecomp_plus
  language: en
  split: train
  limit: 10
  query_ids: []

agent:
  name: gpt_researcher
  config: configs/agents/gpt_researcher_browsecomp_plus.yaml

llm:
  provider: mock
  model: unused
search:
  backend: browsecomp_plus
  retriever: dense
  index_path: third_party/bcp_indexes/bm25
  dense_path: third_party/bcp_indexes/qwen3-embedding-0.6b
  embed_model: qwen3-embedding:0.6b
  top_k: 5

budget:
  max_steps: 32
  max_searches: 64
  max_reads: 128
  max_tokens: 400000
  max_latency_s: 1200.0
  max_evidence: 512
  enforce: false

eval:
  official_benches: []
