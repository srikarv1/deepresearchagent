run_name: gpt-researcher-browsecomp-plus-dense
output_dir: runs
seed: 17
concurrency: 1

dataset:
  name: browsecomp_plus
  language: en
  split: test
  limit: 10
  query_ids: []

agent:
  name: gpt_researcher
  config: configs/agents/gpt_researcher_browsecomp_plus.yaml

llm:
  provider: mock
  model: unused
search:
  # Same HTTP contract as BM25. Ranking is Qwen3-Embedding-8B (BCP paper
  # headline dense row). Caption Acc/Recall as dense-8B, not 0.6B or BM25.
  #   ollama pull qwen3-embedding:8b
  #   python scripts/download_bcp_index.py --kind dense --dense-model qwen3-embedding-8b
  #   adr serve-retriever --retriever dense
  # Orchestration rows (fork srikar/orchestration-policies):
  #   GR_ORCHESTRATOR=none|topk|extractive|llmlingua|prompted \
  #     adr run -c configs/gpt_researcher_browsecomp_plus_dense.yaml \
  #     --run-name bcp-dense-$GR_ORCHESTRATOR
  backend: browsecomp_plus
  retriever: dense
  index_path: third_party/bcp_indexes/bm25
  dense_path: third_party/bcp_indexes/qwen3-embedding-8b
  embed_model: qwen3-embedding:8b
  top_k: 5

budget:
  max_steps: 32
  max_searches: 64
  max_reads: 128
  max_tokens: 400000
  max_latency_s: 1200.0
  max_evidence: 512
  enforce: false

eval:
  official_benches: []
