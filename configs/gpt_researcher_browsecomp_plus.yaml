run_name: gpt-researcher-browsecomp-plus
output_dir: runs
seed: 17
concurrency: 1

dataset:
  # 830 BrowseComp queries with human-labelled evidence docs, decrypted at load
  # time from data/benchmarks/browsecomp_plus/query.jsonl. Ids are the original
  # BrowseComp ids (1..1266, sparse).
  name: browsecomp_plus
  language: en
  # Pinned 70/10/20 hold-out (seed 17). Paper table = test (166). Official
  # BrowseComp-Plus Acc is all 830 — do not caption test Acc as that number.
  # limit: 10 is a smoke cap on this split; drop it for the full hold-out.
  split: test
  limit: 10
  query_ids: []

agent:
  name: gpt_researcher
  config: configs/agents/gpt_researcher_browsecomp_plus.yaml

llm:
  provider: mock
  model: unused
search:
  # Harness-native agents search the corpus through this backend directly.
  # gpt_researcher does not use ctx.search; it reaches the same index through
  # `adr serve-retriever` (see the agent config). Loading is lazy, so this is
  # inert unless an agent actually calls search. For the Qwen3-Embedding-0.6B
  # row use configs/gpt_researcher_browsecomp_plus_dense.yaml instead.
  backend: browsecomp_plus
  retriever: bm25
  index_path: third_party/bcp_indexes/bm25
  top_k: 5

budget:
  max_steps: 32
  max_searches: 64
  max_reads: 128
  max_tokens: 400000
  max_latency_s: 1200.0
  max_evidence: 512
  enforce: false

eval:
  # Accuracy + Recall via adr evaluate --official browsecomp_plus (official
  # grader prompt; recall uses evidence_docs already on the Query).
  official_benches: []
