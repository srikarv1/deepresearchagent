name: browsecomp_plus
# Accuracy uses the official BrowseComp-Plus grader prompt (simple-evals).
# Recall is |retrieved ∩ evidence_docs| / |evidence_docs|; evidence_docs on
# the Query match topics-qrels/qrel_evidence.txt, so the upstream checkout
# is not required. Keep the judge model fixed across a table and caption it.
judge:
  provider: openai
  model: gpt-4.1
  api_key_env: OPENAI_API_KEY
  base_url: null
  temperature: 0.0
  max_output_tokens: 800
  concurrency: 8

timeout_s: null
