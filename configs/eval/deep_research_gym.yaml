name: deep_research_gym
# Official quality / KPR / citation judges. Leave third_party_dir null to let the
# harness search third_party/, then ADR_GYM_DIR, then a sibling clone.
# Accepts Flitternie/deepresearchgym or cxcscmu/deepresearch_benchmarking layouts.
third_party_dir: null
key_point_dir: null
query_file: data/benchmarks/deep_research_gym/researchy_queries_sample_doc_click.jsonl

# Judge model. Needs OPENAI_API_KEY; set OPENAI_BASE_URL for a compatible server.
judge_model: gpt-5-mini

run_quality: true
run_kpr: true
# Citation faithfulness crawls every cited page with crawl4ai. Slow and expensive.
run_citation: false

# Seconds before a judge subprocess is abandoned. null waits forever.
timeout_s: null
