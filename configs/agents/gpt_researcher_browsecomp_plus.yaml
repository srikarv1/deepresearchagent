name: gpt_researcher
repo_path: null
depth: 1
breadth: 4
concurrency: 4
scraper: browser
# NOTE: BrowseComp-Plus is defined over the fixed Tevatron/browsecomp-plus-corpus
# (100K docs, BM25 / Qwen3-Embedding indexes in Tevatron/browsecomp-plus-indexes).
# gpt-researcher has no retriever for that corpus yet, so this runs the same
# queries against the live web via Tavily. Accuracy is comparable to BrowseComp
# numbers only; it is NOT comparable to the BrowseComp-Plus leaderboard, and
# evidence recall cannot be measured until a corpus-backed retriever exists.
retriever: tavily
max_search_results_per_query: 10
max_scraper_workers: 4
trajectory_dir: runs/_gpt_researcher_raw
keep_trajectory_files: true
env:
  STRATEGIC_LLM: "openai:gpt-5-mini"
  SMART_LLM: "openai:gpt-5-mini"
  FAST_LLM: "openai:gpt-5-mini"
  EMBEDDING: "openai:text-embedding-3-small"
  SMART_TOKEN_LIMIT: "8000"
