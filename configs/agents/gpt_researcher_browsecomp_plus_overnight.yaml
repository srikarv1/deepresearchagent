name: gpt_researcher
repo_path: null
# Meeting-scale tree: depth=3, breadth=2. Paper default remains 5x2.
depth: 3
breadth: 2
concurrency: 1
retriever: custom
scraper: bs
max_search_results_per_query: 5
max_scraper_workers: 4
trajectory_dir: runs/_gpt_researcher_raw
keep_trajectory_files: true
env:
  RETRIEVER_ENDPOINT: "http://127.0.0.1:8321/search"
  RETRIEVER_ARG_K: "5"
  STRATEGIC_LLM: "openai:gpt-5-mini"
  SMART_LLM: "openai:gpt-5-mini"
  FAST_LLM: "openai:gpt-5-mini"
  EMBEDDING: "openai:text-embedding-3-small"
  SMART_TOKEN_LIMIT: "8000"
  GR_ANSWER_FORMAT: "browsecomp"
  GR_CONTEXT_BUDGET_TOKENS: "50000"
