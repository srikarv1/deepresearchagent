[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "adr"
version = "0.1.0"
description = "End-to-end harness for testing deep research agent architectures on DeepResearch Bench and DeepResearchGym."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adobe Deep Research" }]
dependencies = [
    "httpx>=0.27",
    "openai>=1.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "selenium>=4.11",
    "tqdm>=4.66",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
adr = "adr.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/adr"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/configs", "/scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
